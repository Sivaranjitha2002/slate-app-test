version: 1.0
jobs:
  hello:
    steps:
      - echo "Hello"
  world:
    steps:
      - echo "World"
  hello-world:
    steps:
      - echo "Hello World!"
  deploy:
    steps:
        - export export CATALYST_AUTH_URL=https://accounts.localzoho.com
        - npm install /catalyst/zcatalyst-cli-1.26.0.tgz -g
        - catalyst deploy --verbose
stages:
  - name: build
    jobs:
      - - hello
        - world
      - hello-world
      - deploy